# SetuHaul CI and the (manual, approval-gated) pilot deployment pipeline. Build item E5.
#
# On every push and pull request: the full test suite on PostgreSQL 18, the database tests again through the RDS Data
# API backend (emulated), the dependency audit, then the build: the Lambda zip is built twice and compared on the
# Ubuntu runner, the stack is synthesised ONCE into cdk.out/, and a credential-free check proves that the template,
# the asset manifest, the staged Lambda zip and build/lambda.zip all identify the same artifact. Nothing touches AWS.
#
# Deployment is a separate, manually started job (workflow_dispatch) that must be confirmed by typing the environment
# name and runs in the GitHub environment "pilot". It runs ONLY from the release branch the release policy defines,
# refs/heads/release/fde-sydney-pilot (review E5-08): the job condition and its first step both refuse any other ref,
# so a manual dispatch on a feature or pull-request branch cannot deploy. The AWS role must enforce the same branch
# through its OIDC trust policy (infra/github_oidc_deploy_trust_policy.json; an external gate until the owner creates
# and verifies it in AWS). On a free private repository the environment cannot require a second reviewer or limit
# deployment branches, so this is an owner-controlled gate, not two-person approval. The job signs in to AWS with
# short-lived OIDC credentials (no stored keys) and deploys the Cloud Assembly the synth job built and checked
# (`cdk deploy --app cdk.out`): it never synthesises from source (review E5-02). It applies migrations, provisions
# database logins and writes the deployment manifest from that same assembly. It never sets SETUHAUL_BOOKING_ENABLED:
# the stack hard-codes "false". It records no gate evidence; that is the step 6 gate procedure
# (docs/release/05_STEP6_GATE_STATUS.md).
#
# Supply chain (review E5-04): every action is pinned to a full commit SHA (the release it was resolved from is in the
# comment, resolved 22 Nov 2026) and the CDK CLI to an exact version. Dependabot alerts cover the actions.
name: ci

on:
  push:
    branches: [main, "release/**", "phase-**"]
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Type 'pilot' to deploy the Sydney pilot stack (owner approval required first)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CDK_CLI: aws-cdk@2.1148.0                  # exact CDK CLI version (released 5 Nov 2026); reads aws-cdk-lib 2.278.0

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17                  # Aurora express configuration runs 17.9 (docs/release/10)
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres_fresh:                          # an EMPTY cluster: migrations run as a non-superuser owner, as on Aurora
        image: postgres:17                  # Aurora express configuration runs 17.9 (docs/release/10)
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SETUHAUL_TEST_DSN: "host=localhost port=5432 user=postgres"
      SETUHAUL_TEST_FRESH_DSN: "host=localhost port=5433 user=postgres"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"            # the Lambda runtime
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0; jsii (aws-cdk-lib) runs on Node
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt -r requirements-aws.txt -r requirements-infra.txt
      - name: Full test suite
        run: python -m pytest tests -q -p no:cacheprovider
      - name: Database tests through the RDS Data API backend (emulated)
        env:
          SETUHAUL_TEST_DATA_API: "1"
        run: >
          python -m pytest -q -p no:cacheprovider tests/test_api.py tests/test_db_requests.py tests/test_approvals.py
          tests/test_orchestrator.py tests/test_outbound.py tests/test_inbound_delivery.py tests/test_concurrency.py
          tests/test_data_api.py tests/test_aws.py tests/test_console_threads.py
      - name: Dependency audit
        run: python -m pip_audit -r requirements-aws.txt -r requirements-dev.txt -r requirements-infra.txt

  synth:
    needs: test
    runs-on: ubuntu-24.04
    env:
      CDK_OUTDIR: cdk.out                    # explicit (review E5-01); infra/app.py also defaults to it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-infra.txt
      - name: Build the Lambda zip twice and compare (reproducible on this runner, review E5-06)
        run: |
          python scripts/build_lambda.py
          cp build/lambda.zip first-build.zip
          python scripts/build_lambda.py
          sha256sum first-build.zip build/lambda.zip
          cmp first-build.zip build/lambda.zip
          rm first-build.zip
      - name: Synthesise the Cloud Assembly once, into cdk.out/ (no AWS call)
        run: python infra/app.py
      - name: Check the assembly without AWS credentials
        run: python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip | tee build/assembly.json
      - name: The pinned CDK CLI reads the assembly (no AWS call)
        run: npx --yes "$CDK_CLI" ls --app cdk.out
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pilot-build
          if-no-files-found: error
          path: |
            cdk.out/
            build/lambda.zip
            build/assembly.json

  deploy:
    needs: synth
    # Deployment branch allow-list: exactly the release branch (review E5-08). The typed confirmation stays required.
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'pilot' && github.ref == 'refs/heads/release/fde-sydney-pilot'
    runs-on: ubuntu-24.04
    environment: pilot
    permissions:
      contents: read
      id-token: write                        # OIDC to AWS; no long-lived keys
    env:
      AWS_REGION: ap-southeast-2
    steps:
      - name: Refuse any ref outside the deployment branch allow-list (before checkout or sign-in)
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_CONFIRM: ${{ github.event.inputs.deploy }}
        run: |
          case "$DEPLOY_REF" in
            refs/heads/release/fde-sydney-pilot) ;;
            *) echo "DEPLOY REFUSED: $DEPLOY_REF is not in the deployment branch allow-list" >&2; exit 1 ;;
          esac
          [ "$DEPLOY_CONFIRM" = "pilot" ] || { echo "DEPLOY REFUSED: confirmation is not 'pilot'" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0 (migrations and scripts)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pilot-build
      - run: pip install -r requirements-aws.txt -r requirements-infra.txt
      - name: Re-check the downloaded assembly before signing in (same result as the synth job)
        run: |
          python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip > build/assembly.deploy.json
          cmp build/assembly.json build/assembly.deploy.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.SETUHAUL_DEPLOY_ROLE_ARN }}     # set by the owner; ap-southeast-2 only
          aws-region: ap-southeast-2
      - name: Deploy the checked assembly (no synthesis from source; booking switch stays false)
        # Unattended: CDK cannot ask for an interactive yes here, so its prompt is off. The gates are the branch
        # allow-list, the typed confirmation and the owner's authorization before the dispatch.
        run: npx --yes "$CDK_CLI" deploy SetuHaulPilot --app cdk.out --require-approval never --outputs-file outputs.json
      - name: Migrations over the Data API
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(jq -r '.SetuHaulPilot.OwnerSecretArn' outputs.json)
          python -m setuhaul.aws.migrate_data_api
      - name: Database logins, one per role
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(jq -r '.SetuHaulPilot.OwnerSecretArn' outputs.json)
          export SETUHAUL_DB_SECRET_ARNS=$(jq -r '.SetuHaulPilot.LoginSecretArns' outputs.json)
          python -m setuhaul.aws.provision_logins
      - name: Synthetic baseline data (SYN- identities, +999 numbers; refuses to run if any non-synthetic row exists)
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(jq -r '.SetuHaulPilot.OwnerSecretArn' outputs.json)
          python -m setuhaul.aws.synthetic_seed
      - name: Deployment manifest from the deployed assembly, checked against its staged zip
        run: |
          python -m setuhaul.ops.manifest cdk.out outputs.json > manifest.json
          python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip --manifest manifest.json
      - name: Publish the staff console (static files to the private bucket; public config only; secret scan first)
        run: |
          python -m setuhaul.ops.console_config outputs.json > console/config.json
          python -m setuhaul.ops.console_config --check console
          BUCKET=$(jq -r '.SetuHaulPilot.ConsoleBucket' outputs.json)
          DIST=$(jq -r '.SetuHaulPilot.ConsoleDistributionId' outputs.json)
          aws s3 sync console/ "s3://$BUCKET/" --delete --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$DIST" --paths "/*" --query Invalidation.Id --output text
          echo "Console: $(jq -r '.SetuHaulPilot.ConsoleUrl' outputs.json)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pilot-manifest
          if-no-files-found: error
          path: manifest.json
