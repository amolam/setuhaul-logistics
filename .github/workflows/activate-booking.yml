# Option D activation for the SYNTHETIC Sydney pilot only (owner's written approval, 23 Nov 2026).
#
# Separate from ci.yml on purpose: ci.yml never carries the booking approval (tests/test_infra.py pins that), so an
# ordinary deployment always turns booking OFF again. This workflow is the only path that turns it on, and only:
# - when started by hand on refs/heads/release/fde-sydney-pilot (job condition and first step; the AWS role's OIDC
#   trust policy pins the same branch), with the typed confirmation and the owner's written approval reference;
# - for the pilot stack: synthetic data only (every function's SETUHAUL_DATA_CLASS is "synthetic"), the internal test
#   sink as the only sender (WhatsApp off), never production (the stack is the pilot; exceptions refuse any production environment).
#
# It runs the full test suite, builds and checks the assembly with the approval in the CDK context (booking ON for the
# api and agent functions only), deploys it, applies migrations and logins, builds the deployment manifest, then, with
# the deploy-evidence database login only, records the manifest, PASS evidence for the gates that passed and the
# owner-approved exceptions for the three the owner accepted (setuhaul/ops/gate_evidence.py --activate). The
# committed Step 6 report (docs/release/evidence/step6_gates.json at this commit) is the evidence artifact. Until
# those rows exist the api and agent refuse to start (fail closed), so the last step waits for /health to say ON.
#
# The kill switch is independent of this workflow: the database refuses new booking commitments while it is engaged
# (an ops_lead in the console, or the owner: python -m setuhaul.ops.kill_switch engage --reason "..."). To turn the
# booking switch itself off, run the ordinary ci.yml deployment.
name: activate-booking

on:
  workflow_dispatch:
    inputs:
      approval_ref:
        description: "The owner's written approval reference, OWNER-APPROVAL-YYYYMMDD-<ref>"
        required: true
      confirm:
        description: "Type 'activate-synthetic-pilot-booking'"
        required: true
      mode:
        description: "activation = the pre-activation gate report (booking OFF); renewal = the active pilot's renewal report (docs/release/evidence/renewal_gates.json); provisional = Option P: record a NEW release with its five non-workflow gates and issue its single-use provisional authorization (docs/release/evidence/provisional_gates.json, a renewal report from the running release)"
        required: true
        default: activation
        type: choice
        options: [activation, renewal, provisional]
      recovery_of:
        description: "provisional only, Recovery Release A (0033): the REVOKED authorization id of the previous release to recover from (owner-approved; empty = the normal no-chaining rule)"
        required: false
        default: ""

permissions:
  contents: read

# D5 (Recovery Release A): an explicit bash shell runs every step with -eo pipefail, so a failing command piped
# into tee (the evidence, issuance and assembly steps) fails its step instead of reporting tee's success.
defaults:
  run:
    shell: bash

env:
  CDK_CLI: aws-cdk@2.1148.0

jobs:
  test:
    if: github.ref == 'refs/heads/release/fde-sydney-pilot'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17.9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
      postgres_fresh:
        image: postgres:17.9
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SETUHAUL_TEST_DSN: "host=localhost port=5432 user=postgres"
      SETUHAUL_TEST_FRESH_DSN: "host=localhost port=5433 user=postgres"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements-dev.txt -r requirements-aws.txt -r requirements-infra.txt
      - name: Full test suite (PostgreSQL 17.9, the pilot's engine)
        run: python -m pytest tests -q -p no:cacheprovider

  synth:
    needs: test
    runs-on: ubuntu-24.04
    env:
      CDK_OUTDIR: cdk.out
      APPROVAL_REF: ${{ github.event.inputs.approval_ref }}
      CONFIRM: ${{ github.event.inputs.confirm }}
      MODE: ${{ github.event.inputs.mode }}
      RECOVERY_OF: ${{ github.event.inputs.recovery_of }}
    steps:
      - name: Refuse without the typed confirmation or a well-formed approval reference
        run: |
          [ "$CONFIRM" = "activate-synthetic-pilot-booking" ] || { echo "REFUSED: confirmation" >&2; exit 1; }
          case "$MODE" in activation|renewal|provisional) ;; *) echo "REFUSED: mode" >&2; exit 1 ;; esac
          echo "$APPROVAL_REF" | grep -Eq '^OWNER-APPROVAL-20[0-9]{6}-[A-Za-z0-9-]{3,40}$' || { echo "REFUSED: approval reference" >&2; exit 1; }
          if [ -n "$RECOVERY_OF" ]; then
            [ "$MODE" = "provisional" ] || { echo "REFUSED: recovery_of applies only to mode=provisional" >&2; exit 1; }
            echo "$RECOVERY_OF" | grep -Eq '^[1-9][0-9]{0,9}$' || { echo "REFUSED: recovery_of must be an authorization id" >&2; exit 1; }
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0
        with:
          node-version: "22"
      - run: pip install -r requirements.txt -r requirements-infra.txt
      - name: Build the Lambda zip twice and compare
        run: |
          python scripts/build_lambda.py
          cp build/lambda.zip first-build.zip
          python scripts/build_lambda.py
          cmp first-build.zip build/lambda.zip
          rm first-build.zip
      - name: Synthesise once with the owner's approval in the context (booking ON for api and agent only)
        run: |
          CDK_CONTEXT_JSON="$(jq -cn --arg r "$APPROVAL_REF" '{booking_approval: $r}')" python infra/app.py
      - name: The template is the synthetic pilot with booking on only where it belongs, and no real sender
        run: |
          python - <<'PY'
          import json
          t = json.load(open("cdk.out/SetuHaulPilot.template.json"))
          fns = {r["Properties"]["FunctionName"]: r["Properties"]["Environment"]["Variables"]
                 for r in t["Resources"].values() if r["Type"] == "AWS::Lambda::Function" and "FunctionName" in r["Properties"]}
          on = {n for n, e in fns.items() if e.get("SETUHAUL_BOOKING_ENABLED") == "true"}
          assert on == {"setuhaul-pilot-api", "setuhaul-pilot-agent"}, on
          assert all(e.get("SETUHAUL_DATA_CLASS", "synthetic") == "synthetic" for e in fns.values())
          out = fns["setuhaul-pilot-outbound"]
          assert out["SETUHAUL_NOTIFICATION_MODE"] == "test_sink" and out["SETUHAUL_WHATSAPP_ENABLED"] == "false", out
          assert t["Outputs"]["BookingMode"]["Value"].startswith("ON (OWNER-APPROVAL-")
          print("booking ON for", sorted(on), "| sender: test sink, WhatsApp off")
          PY
      - name: Check the assembly without AWS credentials
        run: python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip | tee build/assembly.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: pilot-booking-build
          if-no-files-found: error
          path: |
            cdk.out/
            build/lambda.zip
            build/assembly.json

  activate:
    needs: synth
    if: github.ref == 'refs/heads/release/fde-sydney-pilot'
    runs-on: ubuntu-24.04
    environment: pilot
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ap-southeast-2
      APPROVAL_REF: ${{ github.event.inputs.approval_ref }}
      MODE: ${{ github.event.inputs.mode }}
      RECOVERY_OF: ${{ github.event.inputs.recovery_of }}
    steps:
      - name: Refuse any ref outside the deployment branch allow-list
        env:
          DEPLOY_REF: ${{ github.ref }}
        run: |
          [ "$DEPLOY_REF" = "refs/heads/release/fde-sydney-pilot" ] || { echo "REFUSED: $DEPLOY_REF" >&2; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262        # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065    # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020      # v4.4.0
        with:
          node-version: "22"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: pilot-booking-build
      - run: pip install -r requirements-aws.txt -r requirements-infra.txt
      - name: Re-check the downloaded assembly
        run: |
          python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip > build/assembly.deploy.json
          cmp build/assembly.json build/assembly.deploy.json
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4.3.1
        with:
          role-to-assume: ${{ vars.SETUHAUL_DEPLOY_ROLE_ARN }}
          aws-region: ap-southeast-2
      - name: Deploy the checked assembly (booking ON for api and agent; they refuse to start until the gates are recorded)
        run: npx --yes "$CDK_CLI" deploy SetuHaulPilot --app cdk.out --require-approval never --outputs-file outputs.json
      - name: Migrations over the Data API
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(jq -r '.SetuHaulPilot.OwnerSecretArn' outputs.json)
          python -m setuhaul.aws.migrate_data_api
      - name: Database logins, one per role
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(jq -r '.SetuHaulPilot.OwnerSecretArn' outputs.json)
          export SETUHAUL_DB_SECRET_ARNS=$(jq -r '.SetuHaulPilot.LoginSecretArns' outputs.json)
          # M2 (0032): the agent and console secrets must already name this release's logins, or stop here
          python -m setuhaul.aws.provision_logins --expect-release "$(sha256sum build/lambda.zip | cut -c1-12)"
      - name: Deployment manifest from the deployed assembly
        run: |
          python -m setuhaul.ops.manifest cdk.out outputs.json > manifest.json
          python -m setuhaul.ops.assembly cdk.out --zip build/lambda.zip --manifest manifest.json
      - name: Record the manifest, PASS evidence and the owner-approved exceptions (deploy-evidence login only)
        run: |
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_SECRET_ARNS=$(jq -c '.SetuHaulPilot.LoginSecretArns | fromjson | {deploy_evidence}' outputs.json)
          export SETUHAUL_QUEUE_URL=$(jq -r '.SetuHaulPilot.QueueUrl' outputs.json)
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          # the queue's settings are read through the CDK lookup role (ReadOnlyAccess), not the deploy role
          CREDS=$(aws sts assume-role --role-arn "arn:aws:iam::${ACCOUNT}:role/cdk-hnb659fds-lookup-role-${ACCOUNT}-${AWS_REGION}" \
                    --role-session-name setuhaul-gate-queue-read --query Credentials --output json)
          export SETUHAUL_LOOKUP_SESSION=$(echo "$CREDS" | jq -c --arg r "$AWS_REGION" \
                    '{aws_access_key_id: .AccessKeyId, aws_secret_access_key: .SecretAccessKey, aws_session_token: .SessionToken, region_name: $r}')
          echo "::add-mask::$(echo "$CREDS" | jq -r .SecretAccessKey)"
          echo "::add-mask::$(echo "$CREDS" | jq -r .SessionToken)"
          # activation: the pre-activation report (booking OFF), as before. renewal: the active pilot's report, refused
          # unless collected on THIS deployment's code, fresh, naming this approval, with BOOKING_WORKFLOW passing the
          # renewal criteria (setuhaul/ops/renewal.py). Nothing is written otherwise.
          case "$MODE" in
            activation) REPORT=docs/release/evidence/step6_gates.json ;;
            renewal) REPORT=docs/release/evidence/renewal_gates.json ;;
            provisional) REPORT=docs/release/evidence/provisional_gates.json ;;
            *) echo "REFUSED: mode" >&2; exit 1 ;;
          esac
          if [ "$MODE" = "provisional" ]; then
            # Option P (0032): one transaction records the new release (manifest, five gates, exceptions) and issues
            # its single-use authorization; the database refuses all of it unless every 0032 condition holds
            python -m setuhaul.ops.gate_evidence --provisional "$APPROVAL_REF" \
              --release-sha "$GITHUB_SHA" --pipeline-run "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" --window-minutes 60 \
              --report "$REPORT" --manifest manifest.json \
              --template cdk.out/SetuHaulPilot.template.json --environment pilot-ap-southeast-2 \
              --artifact-uri "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${REPORT}" \
              ${RECOVERY_OF:+--recovery-of "$RECOVERY_OF"} \
              | tee activation.json
          else
            python -m setuhaul.ops.gate_evidence --activate "$APPROVAL_REF" \
              --report "$REPORT" --manifest manifest.json \
              --template cdk.out/SetuHaulPilot.template.json --environment pilot-ap-southeast-2 \
              --artifact-uri "https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/${REPORT}" \
              | tee activation.json
          fi
      - name: The api starts with booking ON (fail-closed check passed)
        run: |
          URL=$(jq -r '.SetuHaulPilot.ApiUrl' outputs.json)
          for i in $(seq 1 12); do
            H=$(curl -s "${URL%/}/health" || true); echo "$H"
            # D4: booking_enabled is the database's verdict now (authorized, kill switch off), not the start-up snapshot
            echo "$H" | jq -e '.booking_enabled == true and .booking_state == "authorized" and .status == "ok"' >/dev/null && exit 0
            sleep 10
          done
          echo "the api did not start with booking ON" >&2; exit 1
      - name: Option P failure path - revoke the provisional authorization at once
        # D3: also when the run is cancelled; nothing to revoke if the deploy left no outputs
        if: (failure() || cancelled()) && env.MODE == 'provisional'
        run: |
          [ -f outputs.json ] || { echo "no deploy outputs: no authorization can have been issued"; exit 0; }
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_SECRET_ARNS=$(jq -c '.SetuHaulPilot.LoginSecretArns | fromjson | {deploy_evidence}' outputs.json)
          python -m setuhaul.ops.gate_evidence --environment pilot-ap-southeast-2 \
            --revoke-provisional "pipeline run ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT} failed after issuance"
      - name: Option P failure path - no provisional authorization may stay open (fails the run loudly otherwise)
        if: (failure() || cancelled()) && env.MODE == 'provisional'
        run: |
          [ -f outputs.json ] || { echo "no deploy outputs: nothing was issued"; exit 0; }
          export SETUHAUL_DB_CLUSTER_ARN=$(jq -r '.SetuHaulPilot.ClusterArn' outputs.json)
          export SETUHAUL_DB_SECRET_ARNS=$(jq -c '.SetuHaulPilot.LoginSecretArns | fromjson | {deploy_evidence}' outputs.json)
          python -m setuhaul.ops.gate_evidence --environment pilot-ap-southeast-2 --assert-no-open-provisional \
            || { echo "::error::a provisional authorization is still OPEN after a failed run: ops lead must revoke it now" >&2; exit 1; }
      - name: On failure, re-provision the database logins from the secrets CloudFormation left (rollback safety)
        # M2 (0032): a CloudFormation rollback regenerates the agent and console secrets (and may restore the previous
        # usernames). Provisioning from whatever the secrets now say keeps the database logins and the secrets in
        # step: a rolled-back stack gets its previous logins back, a completed one keeps the release logins. Idempotent.
        if: failure() || cancelled()
        run: |
          # the stack's outputs are read through the CDK lookup role (ReadOnlyAccess); the deploy role cannot describe
          # stacks itself (infra/github_deploy_role_policy.json). Provisioning then runs with the deploy role.
          ACCOUNT=$(aws sts get-caller-identity --query Account --output text)
          CREDS=$(aws sts assume-role --role-arn "arn:aws:iam::${ACCOUNT}:role/cdk-hnb659fds-lookup-role-${ACCOUNT}-${AWS_REGION}" \
                    --role-session-name setuhaul-rollback-read --query Credentials --output json)
          echo "::add-mask::$(echo "$CREDS" | jq -r .SecretAccessKey)"
          echo "::add-mask::$(echo "$CREDS" | jq -r .SessionToken)"
          OUT=$(AWS_ACCESS_KEY_ID=$(echo "$CREDS" | jq -r .AccessKeyId) AWS_SECRET_ACCESS_KEY=$(echo "$CREDS" | jq -r .SecretAccessKey) \
                AWS_SESSION_TOKEN=$(echo "$CREDS" | jq -r .SessionToken) \
                aws cloudformation describe-stacks --stack-name SetuHaulPilot --query 'Stacks[0].Outputs' --output json)
          export SETUHAUL_DB_CLUSTER_ARN=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="ClusterArn") | .OutputValue')
          export SETUHAUL_DB_OWNER_SECRET_ARN=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="OwnerSecretArn") | .OutputValue')
          export SETUHAUL_DB_SECRET_ARNS=$(echo "$OUT" | jq -r '.[] | select(.OutputKey=="LoginSecretArns") | .OutputValue')
          python -m setuhaul.aws.provision_logins
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        if: always()
        with:
          name: pilot-booking-activation
          path: |
            manifest.json
            activation.json
